[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-dashboard"
version = "0.1.0"
description = "Static CI dashboard for historic Ubuntu image (Checkbox) test results"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "ijson>=3.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ci-dashboard = "ci_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_dashboard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

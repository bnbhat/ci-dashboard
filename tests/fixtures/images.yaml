project: carmel
release_path: release
build_path: daily
build_keep: 3
platforms:
  dragonwing:
    arch: arm64
    sector_size: 4096
    testing:
      extra_files:
        - dtb.bin
        - rawprogram0.xml
      config_branch: pe-carmel
      test_plan: com.canonical.qa.carmel::carmel-{type}-{version}-automated
      ignored_tests:
        - reason: 'CI uses a devel kernel; it is expected not to be in main archive'
          patterns: [miscellanea/check_prerelease]
        - reason: https://warthogs.atlassian.net/browse/PECA-1197
          patterns: [.*carmel-wireless/.*, .*ce-oem-wireless/.*]
        - reason: 'Disabled due to CVE-2026-31431; will be re-enabled once fix is in the kernel'
          patterns: [ce-oem-crypto/af_alg_aead_gcm_aes_test]
    testing-stress:
      test_plan: com.canonical.qa.carmel::carmel-{type}-{version}-stress
    extra_ppas:
      - name: carmel-team/carmel-proposed
        fingerprint: C26625BD44AECFC4EF0895170D6BA5A44BB4A48D
        auth_env: CARMEL_PROPOSED_TOKEN
        in_build_types: [devel]
      - name: qcom-iot/qcom-ppa-proposed
        fingerprint: 33EF0ACBC6FE252590ABBAF21C70EB0C444248D7
        in_build_types: [sru]
      - name: carmel-team/carmel-updates
        fingerprint: C26625BD44AECFC4EF0895170D6BA5A44BB4A48D
        auth_env: CARMEL_UPDATES_TOKEN
        in_build_types: [devel, release]
    series:
      noble:
        hooks: dragonwing/classic/noble/
        testing:
          ignored_tests:
            - reason: https://warthogs.atlassian.net/browse/PECA-1290
              patterns: [suspend/1_suspend-time-check_drm_platform_ae01000_display_controller_auto]
            - reason: https://warthogs.atlassian.net/browse/PECA-1289
              patterns: [after-suspend-ce-oem-thermal/.*]
          queues:
            - name: 202403-33871
              alias: RB3 Gen2 Vision Kit
              extra_files:
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/rb3gen2/non-hlos/QLI.1.8-Ver.1.1-ubuntu-QCS6490-nhlos-bins.tar.gz
            - name: 202603-38455
              alias: IQ-9075 Evaluation Kit
              extra_files:
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/iq9/non-hlos/QLI.1.8-Ver.1.1-ubuntu-QCS9100-nhlos-bins.tar.gz
              ignored_tests:
                - reason: https://bugs.launchpad.net/carmel/+bug/2148146
                  patterns: [usb/storage-detect]
            - name: 202601-38369
              alias: IQ-9 AMR Evaluation Kit
              extra_files:
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/amr/non-hlos/QLI.1.8-Ver.1.1-ubuntu-QCS9100-nhlos-bins.tar.gz
              ignored_tests:
                - reason: https://warthogs.atlassian.net/browse/PECA-1719
                  patterns: [.*bluetooth.*, wireless/detect]
                - reason: https://bugs.launchpad.net/carmel/+bug/2158695
                  patterns: [socketcan/.*]
            - name: 202512-38153
              alias: IQ-8275 Evaluation Kit
              extra_files:
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/iq8/non-hlos/QLI.1.8-Ver.1.1-ubuntu-QCS8300-nhlos-bins.tar.gz
            - name: 202605-38802
              alias: Arduino VentUno Q
              extra_files:
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/ventunoq/non-hlos/QLI.1.8-Ver.1.1-ubuntu-QCS8300-nhlos-bins.tar.gz
                - rawprogram0_emmc.xml
              ignored_tests:
                - reason: https://warthogs.atlassian.net/browse/PECA-1695
                  patterns: [usb/storage-detect]
                - reason: https://bugs.launchpad.net/carmel/+bug/2148539
                  patterns: [audio/alsa_record_playback_automated]
        configurations:
          server:
          desktop:
            testing:
              ignored_tests:
                - reason: https://bugs.launchpad.net/carmel/+bug/2114199
                  patterns: [carmel-qim-ai-ml/image-.*, carmel-video/transform-.*, carmel-video/overlay-.*, carmel-video/composition-.*, carmel-video/split-.*]
      resolute:
        hooks: dragonwing/classic/resolute/
        testing:
          test_plan: com.canonical.qa.carmel::carmel-{type}-24-04-automated # use same test-plan as 24.04
          ignored_tests:
            - reason: https://bugs.launchpad.net/carmel/+bug/2154814
              patterns: [carmel-video/.*, carmel-qim-ai-ml/.*]
            - reason: https://bugs.launchpad.net/carmel/+bug/2155041
              patterns: [ce-oem-thermal/.*]
            - reason: https://bugs.launchpad.net/carmel/+bug/2155039
              patterns: [rtc/rtc_alarm_rtc0, suspend/suspend_advanced_auto]
            - reason: https://warthogs.atlassian.net/browse/PECA-1338
              patterns: [wireless/.*, bluetooth.*]
            - reason: https://warthogs.atlassian.net/browse/PECA-1740
              patterns: [miscellanea/debsums]
            - reason: https://warthogs.atlassian.net/browse/PECA-1741
              patterns: [camera/.*]
          queues:
            - name: 202509-37951
              alias: IQ-X7181 Evaluation Kit
              extra_files:
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/iqx7/cdt/IQ-X.1.4-EVK-CDT.tar.gz
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/iqx7/ufs-provisioning/provision.zip
                - https://tel-image-cache.canonical.com/oem-share/carmel/boot-asset/iqx7/non-hlos/IQ-X.1.8-Ver.1.2-ubuntu-X1E80100-nhlos-bins.tar.gz
        testing-stress:
          test_plan: com.canonical.qa.carmel::carmel-{type}-24-04-stress
        configurations:
          server:
          desktop:

<!DOCTYPE html>
<html lang="en" class="is-paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare Devices — CI Dashboard</title>
  <meta name="ci-dashboard-data-base" content="data" />

  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://assets.ubuntu.com/v1/vanilla_framework_version_4.51.0.min.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('ci-dashboard-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'paper');
      var html = document.documentElement;
      html.classList.remove('is-dark', 'is-paper');
      html.classList.add(theme === 'dark' ? 'is-dark' : 'is-paper');
    }());
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="assets/app.js"></script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="p-navigation is-dark">
  <div class="p-navigation__row">
    <div class="p-navigation__banner">
      <div class="p-navigation__tagged-logo">
        <a class="p-navigation__link" href="index.html">
          <div class="p-navigation__logo-tag"><img src="https://assets.ubuntu.com/v1/82818827-CoF_white.svg" alt="Ubuntu" width="32" height="32" /></div>
          <span class="p-navigation__logo-title">CI Dashboard</span>
        </a>
      </div>
      <a href="#main-nav" class="p-navigation__toggle--open" title="Open menu">Menu</a>
      <a href="#main-nav-closed" class="p-navigation__toggle--close" title="Close menu">Close menu</a>
    </div>
    <nav id="main-nav" class="p-navigation__nav" aria-label="Main navigation">
      <ul class="p-navigation__items">
        <li class="p-navigation__item"><a class="p-navigation__link" href="index.html">Overview</a></li>
        <li class="p-navigation__item"><a class="p-navigation__link" href="tests.html">Tests</a></li>
        <li class="p-navigation__item is-selected"><a class="p-navigation__link" href="compare.html">Compare Devices</a></li>
      </ul>
      <ul class="p-navigation__items p-navigation__items--right">
        <li class="p-navigation__item u-vertically-center">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero-section" style="padding: 1.5rem 1.5rem;">
  <div class="hero-inner">
    <h1 class="hero-title" style="font-size:1.5rem;">Cross-Device <strong>Comparison</strong></h1>
    <p class="hero-subtitle">Latest status of every test, side-by-side across all 8 devices — spot device-specific failures at a glance.</p>
  </div>
</section>

<main class="l-content" x-data="comparePage()" x-init="load()">

  <template x-if="loading"><div class="u-loading"><div class="u-spinner"></div><p>Loading comparison matrix…</p></div></template>
  <template x-if="error"><div class="p-notification--negative"><div class="p-notification__content"><p class="p-notification__message" x-text="error"></p></div></div></template>

  <template x-if="!loading && !error">
    <div>
      <div class="filter-bar">
        <div class="filter-field">
          <label for="search">Search test name / id</label>
          <input id="search" type="text" x-model="search" placeholder="filter tests…" />
        </div>
        <div class="filter-field">
          <label for="category">Category</label>
          <select id="category" x-model="categoryFilter">
            <option value="">All categories</option>
            <template x-for="c in categories" :key="c"><option :value="c" x-text="c"></option></template>
          </select>
        </div>
        <div class="filter-field">
          <label>Show only</label>
          <div class="filter-checkboxes">
            <label><input type="checkbox" x-model="onlyDiffering"> Tests differing across devices</label>
            <label><input type="checkbox" x-model="onlyFailing"> Tests with at least one failure</label>
          </div>
        </div>
      </div>

      <p class="summary-meta" x-text="filteredTests.length + ' of ' + matrix.tests.length + ' tests · generated ' + formatTimestamp(matrix.generated_at)"></p>

      <div class="compare-matrix">
        <table class="p-table">
          <thead>
            <tr>
              <th>Test</th>
              <th>Category</th>
              <template x-for="d in matrix.devices" :key="d"><th class="device-col" x-text="deviceLabel(d)"></th></template>
            </tr>
          </thead>
          <tbody>
            <template x-for="t in filteredTests" :key="t.slug">
              <tr>
                <td><a class="test-name-link" @click="window.location.href = 'tests.html?test=' + encodeURIComponent(t.slug)" x-text="t.name"></a></td>
                <td x-text="t.category"></td>
                <template x-for="d in matrix.devices" :key="d">
                  <td class="status-cell" @click="goToRun(t, d)" :title="t.latest_by_device[d] && t.latest_by_device[d].ignore_reason || ''">
                    <template x-if="t.latest_by_device[d]">
                      <span class="status-chip" :class="statusChipClass(t.latest_by_device[d].status)" x-text="statusLabel(t.latest_by_device[d].status)"></span>
                    </template>
                    <template x-if="!t.latest_by_device[d]">
                      <span class="summary-meta">—</span>
                    </template>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <template x-if="filteredTests.length === 0">
        <div class="u-empty">No tests match the current filters.</div>
      </template>
    </div>
  </template>
</main>

<footer class="ubuntu-footer"><div class="ubuntu-footer-inner">CI Dashboard — Cross-device comparison, latest result per device.</div></footer>

<script>
function comparePage() {
  return {
    loading: true,
    error: null,
    matrix: { devices: [], tests: [], device_meta: {}, generated_at: null },
    search: '',
    categoryFilter: '',
    onlyDiffering: false,
    onlyFailing: false,
    formatTimestamp, statusChipClass, statusLabel,

    deviceLabel(cid) {
      const meta = (this.matrix.device_meta || {})[cid];
      return meta && meta.alias ? meta.alias : cid;
    },

    async load() {
      try {
        this.matrix = await fetchJSON('compare.json');
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    },

    get categories() {
      return [...new Set(this.matrix.tests.map((t) => t.category))].sort();
    },

    get filteredTests() {
      const q = this.search.trim().toLowerCase();
      return this.matrix.tests.filter((t) => {
        if (q && !(t.name.toLowerCase().includes(q) || t.full_id.toLowerCase().includes(q))) return false;
        if (this.categoryFilter && t.category !== this.categoryFilter) return false;
        const statuses = Object.values(t.latest_by_device).map((e) => e.status);
        if (this.onlyFailing && !statuses.includes('fail')) return false;
        if (this.onlyDiffering && new Set(statuses).size <= 1) return false;
        return true;
      });
    },

    goToRun(test, device) {
      const entry = test.latest_by_device[device];
      if (entry) window.location.href = `runs.html?run=${encodeURIComponent(entry.run_id)}`;
    },
  };
}
</script>

</body>
</html>

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          # Don't fail the build the very first time, before the data
          # branch/ingest workflow has ever run.
          fetch-depth: 1
        continue-on-error: true

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r code/docs/. site/
          mkdir -p site/data
          if [ -d data-branch/docs/data ]; then
            cp -r data-branch/docs/data/. site/data/
          else
            echo "No data branch content yet — deploying with empty data/."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
